<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七国纵横 · 外交</title>
<style>
:root{
  --bg:#0f141c; --panel:#18202c; --panel2:#1e2836; --line:#2a3545;
  --text:#e6ebf2; --muted:#8d9aab; --accent:#e0b44c; --bad:#e5484d; --ok:#3fb950;
  --a:#e06c75; --e:#61afef; --f:#56b6c2; --g:#8d9aab; --i:#98c379; --r:#c678dd; --t:#e5c07b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-size:16px;font-weight:500;letter-spacing:.5px}
.brand b{color:var(--accent)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.phase{margin-left:auto;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
header button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer}
header button:hover{border-color:var(--muted)}
header input.adm{width:130px;padding:5px 9px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px}
header input.adm.bad{border-color:var(--bad)}
main{flex:1;display:flex;min-height:0}
aside{width:200px;border-right:1px solid var(--line);padding:10px;overflow:auto;flex-shrink:0}
.seat{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.seat:hover{background:var(--panel2)}
.seat.on{background:var(--panel2);border-color:var(--accent)}
.seat .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.seat .nm{font-size:13px}
.seat .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seat .rd{font-size:10px;color:var(--ok)}
.seat.dead{opacity:.4}
.seat small{display:block;font-size:10px;color:var(--muted)}
section.panel{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:6px 12px;cursor:pointer;font-size:13px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:14px 16px;display:none;min-height:0}
.pane.on{display:block}
#brief{font:13px/1.75 ui-monospace,"Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.ln{min-height:1.2em}
.ln.h1{color:var(--accent);font-weight:500;margin:6px 0 4px}
.ln.h2{color:#b9c6d6;font-weight:500;margin:8px 0 2px}
.ln.sep{color:var(--muted);border-top:1px dashed var(--line);margin:8px 0;padding-top:6px}
.ln.me{color:var(--ok)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font:13px/1.6 inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;margin-top:12px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
pre.out{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:280px;overflow:auto;margin:10px 0 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 16px;border-radius:6px;font-size:13px;max-width:80vw;opacity:0;pointer-events:none;transition:opacity .2s;white-space:pre-wrap}
#toast.show{opacity:1}
#toast.err{border-left-color:var(--bad)}
#toast.ok{border-left-color:var(--ok)}
.banner{padding:10px 16px;background:#2a1f14;border-bottom:1px solid #4a3a1c;color:var(--accent);font-size:13px}
.hidden{display:none!important}
@media(max-width:700px){aside{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:150px}main{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="brand">七国<b>纵横</b></div>
  <span class="tag">B0 · 热座</span>
  <div class="phase" id="phase">读取中…</div>
  <input id="adminKey" class="adm" type="password" placeholder="管理密钥" autocomplete="off" hidden>
  <button id="btnRefresh">刷新</button>
  <button id="btnNew">新局</button>
</header>
<div class="banner" id="banner">热座模式：你持有全部七个座位的令牌，点左侧国家即切换视角。正式对局请把令牌分发给不同玩家。</div>
<main>
  <aside id="seats"></aside>
  <section class="panel">
    <div class="tabs">
      <button data-tab="brief" class="on">简报</button>
      <button data-tab="send">发信</button>
      <button data-tab="orders">军令</button>
      <button data-tab="inbox">收件箱</button>
    </div>
    <div class="pane on" id="pane-brief"><div id="brief"></div></div>

    <div class="pane" id="pane-send">
      <label>收件人</label>
      <select id="sendTo"></select>
      <label>正文（<span id="sendCount">0</span>/<span id="sendLimit">300</span> 字）</label>
      <textarea id="sendText" placeholder="提议：我春季不进勃艮第，你守好马赛。"></textarea>
      <button class="btn" id="btnSend">发送</button>
      <div class="hint">承诺没有强制力，允许欺骗。公开发言用 GLOBAL（上限 400 字）。</div>
    </div>

    <div class="pane" id="pane-orders">
      <label>军令（每行一条，提交整份）</label>
      <textarea id="ordersText" placeholder="A PAR - BUR&#10;A MAR S A PAR - BUR&#10;F BRE - MAO"></textarea>
      <div class="row">
        <button class="btn" id="btnOrders">提交军令</button>
        <button class="btn ghost" id="btnLegal">查看合法命令</button>
      </div>
      <pre class="out hidden" id="legalOut"></pre>
      <div class="hint">未下令的部队不会自动驻守，每支需要行动的部队都要下令。</div>
    </div>

    <div class="pane" id="pane-inbox">
      <div class="row">
        <div><label>只看某国</label><select id="inboxWith"><option value="">全部</option></select></div>
        <div><label>只看某阶段</label><input id="inboxPhase" placeholder="S1901M"></div>
      </div>
      <button class="btn" id="btnInbox">查询</button>
      <pre class="out" id="inboxOut">—</pre>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const POWERS=[["AUSTRIA","奥地利","a"],["ENGLAND","英国","e"],["FRANCE","法国","f"],["GERMANY","德国","g"],["ITALY","意大利","i"],["RUSSIA","俄国","r"],["TURKEY","土耳其","t"]];
const NAME=Object.fromEntries(POWERS.map(([c,n])=>[c,n]));
const KEY="dw.prefs.v1";
let tokens={}, seat="ITALY", timer=null, busy=false, adminKey="";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function toast(msg,kind=""){const t=$("#toast");t.textContent=msg;t.className="show "+kind;clearTimeout(t._h);t._h=setTimeout(()=>t.className="",4200);}

async function api(path,opt={}){
  const h=Object.assign({},opt.headers||{});
  if(tokens[seat]) h["X-Seat-Token"]=tokens[seat];
  if(adminKey) h["X-Admin-Key"]=adminKey;
  if(opt.body) h["Content-Type"]="application/json";
  const r=await fetch(path,Object.assign({},opt,{headers:h}));
  const txt=await r.text();
  let d={}; try{d=JSON.parse(txt)}catch(e){d={detail:txt.slice(0,300)}}
  if(!r.ok){
    if(r.status===403 && String(d.detail||"").includes("管理员密钥")) showAdmin(true);
    throw new Error(d.detail||("HTTP "+r.status));
  }
  return d;
}

function showAdmin(bad){
  const el=$("#adminKey");
  el.hidden=false;
  if(bad){ el.classList.add("bad"); el.focus(); }
}

function save(){localStorage.setItem(KEY,JSON.stringify({tokens,seat,adminKey}));}
function load(){
  try{
    const v=JSON.parse(localStorage.getItem(KEY)||"{}");
    tokens=v.tokens||{}; seat=v.seat||"ITALY"; adminKey=v.adminKey||"";
  }catch(e){}
  if(adminKey) $("#adminKey").value=adminKey;
}

$("#adminKey").oninput=()=>{
  adminKey=$("#adminKey").value.trim();
  $("#adminKey").classList.remove("bad");
  save();
};
$("#adminKey").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); boot(); } };

function renderSeats(st){
  const el=$("#seats");
  el.innerHTML=POWERS.map(([c,n,k])=>{
    const p=st?.players?.[c]||{};
    const cnt=st?.centers?.[c]??0, un=st?.units?.[c]??0;
    const dead=p.active===false?" dead":"";
    const ready=p.ready?"<span class='rd'>已交</span>":"";
    return `<div class="seat${seat===c?" on":""}${dead}" data-p="${c}">
      <span class="dot" style="background:var(--${k})"></span>
      <span class="nm">${n}${ready}</span>
      <span class="cnt">${cnt}城/${un}军</span>
    </div>`;
  }).join("");
  el.querySelectorAll(".seat").forEach(e=>e.onclick=()=>{seat=e.dataset.p;save();renderSeats(st);refresh();});
  const opts=POWERS.filter(([c])=>c!==seat).map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
  $("#sendTo").innerHTML=opts+"<option value='GLOBAL'>GLOBAL（全体公开）</option>";
  $("#sendLimit").textContent=300;
  $("#inboxWith").innerHTML="<option value=''>全部</option>"+opts;
}

function renderBrief(text){
  return text.split("\n").map(l=>{
    if(l.startsWith("====")) return `<div class="ln h1">${esc(l)}</div>`;
    if(l.startsWith("【")) return `<div class="ln h2">${esc(l)}</div>`;
    if(l.startsWith("——")) return `<div class="ln sep">${esc(l)}</div>`;
    if(l.startsWith("你已提交")) return `<div class="ln me">${esc(l)}</div>`;
    return `<div class="ln">${esc(l)||"&nbsp;"}</div>`;
  }).join("");
}

let lastErr="";

async function refresh(){
  if(busy) return;
  if(!tokens[seat]){
    // 还没建局（多半是等管理密钥）：把空状态画出来，别让页面看着像坏了
    renderSeats(null);
    $("#phase").textContent=adminKey?"等待开局":"等待管理密钥";
    return;
  }
  try{
    const st=await api("/api/state");
    renderSeats(st);
    $("#phase").textContent=st.game_over?("已结束 · "+(st.result_text||"")):st.phase;
    const b=await api("/api/brief");
    $("#brief").innerHTML=renderBrief(b.text);
    if(st.game_over){
      $("#banner").classList.remove("hidden");
      $("#banner").textContent="对局已结束："+(st.result_text||"")+"　点右上「新局」重开。";
    }
    lastErr="";
  }catch(e){
    $("#phase").textContent="连接失败";
    if(e.message!==lastErr){ toast(e.message,"err"); lastErr=e.message; }
  }
}

async function boot(){
  load();
  try{
    const h=await api("/healthz");
    if(h.admin_required) showAdmin(false);
    const d=await api("/api/match",{method:"POST"});
    tokens=d.tokens;
    if(!tokens[seat]) seat="ITALY";
    save();
    renderSeats(d.summary);
    $("#adminKey").classList.remove("bad");
    await refresh();
  }catch(e){
    const needKey=String(e.message||"").includes("管理员密钥");
    toast(needKey ? "需要管理密钥：请在右上角输入后按回车" : "建局失败："+e.message,"err");
    $("#phase").textContent=needKey?"等待管理密钥":"连接失败";
    $("#brief").innerHTML='<div class="ln h2">尚未开局</div><div class="ln">'
      + (needKey
          ? "本服务已启用管理员密钥：在右上角输入后按回车即可开局。"
          : "服务端未创建对局，请点右上「新局」。")
      + "</div>";
    renderSeats(null);
  }
  clearInterval(timer); timer=setInterval(refresh,5000);
}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+b.dataset.tab));
  history.replaceState(null,"","#"+b.dataset.tab);
});
(function initTab(){
  const want=(location.hash||"").replace("#","");
  const btn=[...document.querySelectorAll(".tabs button")].find(b=>b.dataset.tab===want);
  if(btn) btn.click();
})();

$("#sendTo").onchange=()=>{const pub=$("#sendTo").value==="GLOBAL";$("#sendLimit").textContent=pub?400:300;};
$("#sendText").oninput=()=>{$("#sendCount").textContent=$("#sendText").value.length;};

$("#btnSend").onclick=async()=>{
  const to=$("#sendTo").value, text=$("#sendText").value.trim();
  if(!text) return toast("正文不能为空","err");
  try{
    const d=await api("/api/send",{method:"POST",body:JSON.stringify({to,text})});
    toast(d.result.text+(d.settled?"\n本阶段已结算":"") ,"ok");
    $("#sendText").value=""; $("#sendCount").textContent="0";
    await refresh();
  }catch(e){ toast(e.message,"err"); }
};

$("#btnOrders").onclick=async()=>{
  const raw=$("#ordersText").value.split("\n").map(s=>s.trim()).filter(Boolean);
  try{
    const d=await api("/api/orders",{method:"POST",body:JSON.stringify({orders:raw})});
    toast(d.result.text+(d.settled?"\n本阶段已结算":"") ,"ok");
    await refresh();
  }catch(e){ toast(e.message,"err"); }
};

$("#btnLegal").onclick=async()=>{
  try{
    const d=await api("/api/legal");
    $("#legalOut").classList.remove("hidden");
    $("#legalOut").textContent=d.text;
  }catch(e){ toast(e.message,"err"); }
};

$("#btnInbox").onclick=async()=>{
  const w=$("#inboxWith").value, ph=$("#inboxPhase").value.trim();
  const q=new URLSearchParams(); if(w)q.set("with",w); if(ph)q.set("phase",ph);
  try{
    const d=await api("/api/inbox?"+q.toString());
    $("#inboxOut").textContent=d.text;
  }catch(e){ toast(e.message,"err"); }
};

$("#btnRefresh").onclick=()=>{refresh();toast("已刷新");};

$("#btnNew").onclick=async()=>{
  if(!confirm("清空当前对局并开新局？旧存档会在服务器上备份一份。")) return;
  try{
    const d=await api("/api/reset",{method:"POST",body:JSON.stringify({confirm:true})});
    tokens=d.tokens; save(); toast("新局已开始","ok"); await refresh();
  }catch(e){ toast(e.message,"err"); }
};

boot();
</script>
</body>
</html>
