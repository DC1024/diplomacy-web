name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 静态检查
        run: ruff check .
      - name: 单元测试
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: diplomacy-web:ci
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 容器冒烟
        run: |
          docker run -d --name dw -p 8080:8080 diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- healthz（版本应为 ci）---"
          curl -fsS http://127.0.0.1:8080/healthz \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['version']=='ci', d; print('version ok:', d)"
          echo
          echo "--- 建局 ---"
          curl -fsS -X POST http://127.0.0.1:8080/api/match \
            | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['tokens'])==7, d; print('7 seats ok, phase', d['phase'])"
      - name: 失败时打印容器日志
        if: failure()
        run: docker logs dw || true
      - name: 清理
        if: always()
        run: docker rm -f dw || true

      # 回归测试：绑定挂载一个属主不是 10001 的目录（Linux 上最典型的部署方式），
      # 早期版本会因 /data 不可写而在建局时 500。CI 的裸跑冒烟测不出来。
      - name: 绑定挂载冒烟（权限回归）
        run: |
          mkdir -p /tmp/dwdata
          ls -ld /tmp/dwdata
          docker run -d --name dw-bind -p 8081:8080 \
            -v /tmp/dwdata:/data -e DATA_DIR=/data diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- 建局（绑定挂载）---"
          curl -fsS -X POST http://127.0.0.1:8081/api/match \
            | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['tokens'])==7, d; print('bind mount ok, phase', d['phase'])"
          echo "--- 落盘检查 ---"
          test -f /tmp/dwdata/state.json && echo "state.json written by uid $(stat -c %u /tmp/dwdata/state.json)"
          echo "--- 进程身份 ---"
          docker exec dw-bind id
      - name: 失败时打印绑定挂载日志
        if: failure()
        run: docker logs dw-bind || true
      - name: 清理绑定挂载
        if: always()
        run: docker rm -f dw-bind || true

      # 管理面：设了 ADMIN_KEY 后，无密钥的建局必须被拒（否则等于公开全部私信）
      - name: 管理密钥冒烟
        run: |
          docker run -d --name dw-adm -p 8082:8080 -e ADMIN_KEY=smoke diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8082/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- healthz ---"
          curl -fsS http://127.0.0.1:8082/healthz \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['admin_required'] is True, d; assert 'exposed' in d, d; print('admin_required ok')"
          echo "--- 无密钥应 403 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8082/api/match)
          test "$code" = "403" && echo "403 ok"
          echo "--- 带密钥应 200 且 7 个令牌 ---"
          curl -fsS -X POST http://127.0.0.1:8082/api/match -H 'X-Admin-Key: smoke' > /tmp/match.json
          python -c "import json; d=json.load(open('/tmp/match.json',encoding='utf-8')); assert len(d['tokens'])==7, d; print('gated match ok')"
          echo "--- 座位链接应一国一条，令牌与国家对得上 ---"
          curl -fsS -X POST http://127.0.0.1:8082/api/links -H 'X-Admin-Key: smoke' \
            | python -c "import json,sys; from urllib.parse import urlparse,parse_qs; d=json.load(sys.stdin)['links']; assert len(d)==7, d; assert all(parse_qs(urlparse(u).query)['seat']==[p] for p,u in d.items()), d; print('links ok')"
          echo "--- SSE 应立刻给出快照，且一个令牌都不能带 ---"
          # --max-time 会以 28 退出，取到前几帧就够了；关键看是否「连上就给」以及有没有漏令牌
          curl -sN --max-time 5 http://127.0.0.1:8082/api/events > /tmp/sse.txt || true
          head -4 /tmp/sse.txt
          python -c "import sys; raw=open('/tmp/sse.txt',encoding='utf-8').read(); assert 'event: state' in raw, '没收到 state 帧：'+raw[:200]; assert 'token' not in raw.lower(), '推送里混进了座位令牌'; print('sse ok')"
          echo "--- 地图几何要能从 wheel 里带的 standard.svg 解析出来 ---"
          # 这一步只在容器里才有意义：本地跑通了不代表镜像里有那份 SVG
          curl -fsS http://127.0.0.1:8082/api/map > /tmp/map.json
          python -c "import json; d=json.load(open('/tmp/map.json',encoding='utf-8')); assert len(d['areas'])==76, len(d['areas']); assert d['missing']==[], d['missing']; assert len(d['viewBox'])==4, d['viewBox']; print('map ok', len(d['areas']), 'areas')"
          echo "--- 地图数据面：22 支部队、34 个中心，命令只给自己的座位 ---"
          # 令牌换座位就看，法国只应拿到 BRE/MAR/PAR 三处可下令地点
          T=$(python -c "import json;print(json.load(open('/tmp/match.json'))['tokens']['FRANCE'])")
          curl -fsS http://127.0.0.1:8082/api/board -H "X-Seat-Token: $T" > /tmp/board.json
          python -c "import json; d=json.load(open('/tmp/board.json',encoding='utf-8')); assert len(d['units'])==22, len(d['units']); assert len(d['centers'])==22, len(d['centers']); assert set(d['mine'])=={'BRE','MAR','PAR'}, d['mine']; assert d['editable'] is True; print('board ok')"
      - name: 失败时打印管理密钥日志
        if: failure()
        run: docker logs dw-adm || true
      - name: 清理管理密钥容器
        if: always()
        run: docker rm -f dw-adm || true

      - name: 模型座位冒烟（脚本模型，不花钱）
        run: |
          docker run -d --name dw-llm -p 8083:8080 -e LLM_PROVIDER=scripted diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8083/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8083/api/match > /dev/null
          echo "--- 把意大利交给模型 ---"
          curl -fsS -X POST http://127.0.0.1:8083/api/llm/seat \
            -H 'Content-Type: application/json' -d '{"power":"ITALY","enabled":true}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['enabled'] is True, d; print('seat on ok')"
          # 关键在「不手动驱动」：以前这里调 /api/llm/tick，绕开了后台线程，
          # 结果镜像里线程根本没启动（启动写在 main() 里，而镜像是 uvicorn app.main:app）都没被发现。
          echo "--- 不手动 tick，等后台线程自己交令（最多 25 秒）---"
          ready=False
          for i in $(seq 1 25); do
            ready=$(curl -fsS http://127.0.0.1:8083/api/state \
              | python -c "import json,sys; print(json.load(sys.stdin)['players']['ITALY']['ready'])")
            if [ "$ready" = "True" ]; then break; fi
            sleep 1
          done
          echo "ITALY ready=$ready"
          test "$ready" = "True" && echo "seat acted by background loop"
          echo "--- 这一手应当真花过 token，且不是故障兜底 ---"
          curl -fsS http://127.0.0.1:8083/api/llm \
            | python -c "import json,sys; u=json.load(sys.stdin)['seats']['ITALY']['usage']; assert u['calls']>=1, u; assert u['fallbacks']==0, u; print('usage ok', u)"
          echo "--- 上下文窗口有内容 ---"
          curl -fsS 'http://127.0.0.1:8083/api/llm/context?power=ITALY' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['text'] and d['stats']['chars']>0, d; print('context ok', d['stats'])"
      - name: 失败时打印模型座位日志
        if: failure()
        run: docker logs dw-llm || true
      - name: 清理模型座位容器
        if: always()
        run: docker rm -f dw-llm || true

      # 网页改配置：只有容器里才验得全——静态页要能拿到新表单、配置要落在 /data 卷上、
      # 存完之后不重启就能把座位交出去。单测跑的是 TestClient，证不了这些。
      - name: 模型配置冒烟（网页改配置，不重启）
        env:
          # 写进配置、再拿去反查响应里有没有明文。同一变量出两次，断言才不会退化成
          # 「随便一个不存在的串自然不在响应里」。
          CFG_SECRET: 'sk-should-not-leak-1234'
        run: |
          docker run -d --name dw-cfg -p 8084:8080 diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8084/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8084/api/match > /dev/null
          echo "--- 默认什么都没有，来源必须是 none 而不是 env ---"
          curl -fsS http://127.0.0.1:8084/api/llm/settings \
            | python -c "import json,sys; s=json.load(sys.stdin)['settings']; assert s['source']=='none', s; assert s['configured'] is False, s; print('unconfigured ok')"
          echo "--- 存一份配置（离线脚本 + 密钥），来源变 file ---"
          curl -fsS -X PUT http://127.0.0.1:8084/api/llm/settings -H 'Content-Type: application/json' \
            -d "{\"mode\":\"scripted\",\"budget_cny\":3,\"api_key\":\"$CFG_SECRET\"}" \
            | python -c "import json,os,sys; s=json.load(sys.stdin)['settings']; k=os.environ['CFG_SECRET']; assert s['source']=='file', s; assert s['configured'] is True, s; assert s['budget_cny']==3, s; assert s['has_key'] is True, s; assert s['key_hint'].endswith(k[-4:]) and k not in s['key_hint'], s; print('save ok', s['key_hint'])"
          echo "--- 密钥不能回显（连尾四位之外的任何片段都不行）---"
          curl -fsS http://127.0.0.1:8084/api/llm/settings > /tmp/cfg.json
          python -c "import json,os,pathlib; k=os.environ['CFG_SECRET']; t=pathlib.Path('/tmp/cfg.json').read_text(); assert k not in t, 'key leaked: '+t; s=json.loads(t)['settings']; assert 'api_key' not in s, s; print('no leak ok')"
          echo "--- 存完就能把座位交给模型，不需要重启 ---"
          curl -fsS -X POST http://127.0.0.1:8084/api/llm/seat -H 'Content-Type: application/json' \
            -d '{"power":"ITALY"}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['enabled'] is True, d; assert d['seat']['provider']=='scripted', d; print('seat ok')"
          echo "--- 配置真的落在 /data 卷里（换容器也还在）---"
          docker exec dw-cfg sh -c 'test -s /data/llm.json && grep -q scripted /data/llm.json' \
            && echo "file ok"
      - name: 失败时打印配置日志
        if: failure()
        run: docker logs dw-cfg || true
      - name: 清理配置容器
        if: always()
        run: docker rm -f dw-cfg || true

      # 阶段时钟：没人交令时它必须自己把局面推下去。
      # 这是「一个人挂机不会冻住全桌」唯一的端到端证明——单测只能证明函数逻辑，证不了线程真的在跑。
      - name: 阶段时钟冒烟
        run: |
          docker run -d --name dw-clock -p 8084:8080 -e PHASE_SECONDS=2 diplomacy-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8084/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8084/api/match > /dev/null
          echo "--- 开局应当有倒计时 ---"
          curl -fsS http://127.0.0.1:8084/api/state \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['phase']=='S1901M' and d['deadline_left'] is not None, d; print('deadline ok')"
          echo "--- 一个人都不交令，等它自己结算（最多 60 秒）---"
          phase=S1901M
          for i in $(seq 1 60); do
            phase=$(curl -fsS http://127.0.0.1:8084/api/state \
              | python -c "import json,sys; print(json.load(sys.stdin)['phase'])")
            if [ "$phase" != "S1901M" ]; then break; fi
            sleep 1
          done
          echo "phase=$phase"
          test "$phase" != "S1901M" && echo "clock settled ok"
      - name: 失败时打印阶段时钟日志
        if: failure()
        run: docker logs dw-clock || true
      - name: 清理阶段时钟容器
        if: always()
        run: docker rm -f dw-clock || true